<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1016" width="1000" height="1016" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" role="img" aria-labelledby="t d">
  <title id="t">xdm-scout model flow: LLM writes, decision model scores, code and a person decide</title>
  <desc id="d">An LLM scores and drafts, a decision model answers six yes or no questions with a probability, code rules run before and after, and a person approves the exact text. A session log shows a real run.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#0b1f33"/><rect width="2.2" height="6" fill="#1d4ed8" opacity=".55"/></pattern>
    <style>
      .bg{fill:#0a0e13}
      .t{font-size:13px;fill:#e2e8f0;font-weight:700}
      .m{font-size:11.5px;fill:#94a3b8}
      .w{font-size:11.5px;fill:#e2e8f0}
      .h{font-size:13px;font-weight:700}
      .p{fill:#c4b5fd}.b{fill:#7dd3fc}.g{fill:#86efac}.o{fill:#fcd34d}
      .box-p{fill:#120d24;stroke:#a78bfa;stroke-width:1.6;stroke-dasharray:6 4}
      .box-b{fill:#08121f;stroke:#38bdf8;stroke-width:1.8}
      .box-g{fill:#0a1a10;stroke:#4ade80;stroke-width:1.6;stroke-dasharray:6 4}
      .box-o{fill:#1c1407;stroke:#f59e0b;stroke-width:1.6}
      .box-o2{fill:#1c1407;stroke:#f59e0b;stroke-width:1.6;stroke-dasharray:6 4}
      .track{fill:#0b1f33;stroke:#1e3a5f;stroke-width:1}
      .ln{stroke:#64748b;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dim{fill:#475569}
      .pl{fill:#c4b5fd;font-size:11.5px;font-weight:700}
      .gl{fill:#86efac;font-size:11.5px}
    </style>
  </defs>
  <rect class="bg" width="1000" height="1016" rx="14"/>
  <circle cx="22" cy="22" r="5" fill="#ef4444"/><circle cx="40" cy="22" r="5" fill="#f59e0b"/><circle cx="58" cy="22" r="5" fill="#22c55e"/>
  <text class="m" x="500" y="26" text-anchor="middle">~/xdm-scout · zsh (models)</text>

  <text class="t" x="500" y="66" text-anchor="middle">XDM-SCOUT MODEL FLOW  ·  <tspan class="p">LLM WRITES</tspan>  ·  <tspan class="b">DECISION MODEL SCORES</tspan>  ·  <tspan class="g">CODE</tspan> + <tspan class="o">A PERSON DECIDE</tspan></text>
  <text class="m" x="500" y="88" text-anchor="middle"><tspan class="p">■</tspan> llm gpt-6-luna   <tspan class="b">■</tspan> decision gpt-6-luna   <tspan class="g">■</tspan> code, no model   <tspan class="o">■</tspan> person</text>

  <!-- Left: person -->
  <rect class="box-o" x="20" y="112" width="236" height="610" rx="10"/>
  <text class="h o" x="138" y="138" text-anchor="middle">A PERSON</text>
  <text class="m" x="138" y="156" text-anchor="middle">Review and Inbox · only place</text>
  <text class="m" x="138" y="170" text-anchor="middle">a message can be approved</text>
  <rect x="34" y="186" width="208" height="30" rx="6" fill="#2a1d06" stroke="#f59e0b"/>
  <text class="w" x="46" y="206">◆ reads Fit reasons + posts</text>
  <text class="m" x="46" y="240">cited posts open on X;</text>
  <text class="m" x="46" y="254">no number decides a fit</text>
  <text class="w" x="46" y="298">◆ ticks a model "No"</text>
  <text class="m" x="46" y="316">Approve is refused until</text>
  <text class="m" x="46" y="330">the warning is read</text>
  <text class="w" x="46" y="374">◆ confirms a model stop</text>
  <text class="m" x="46" y="392">a reply the model reads as</text>
  <text class="m" x="46" y="406">stop waits for one click</text>
  <text class="w" x="46" y="450">◆ approves the exact text</text>
  <text class="m" x="46" y="468">Send checks its hash</text>
  <text class="w" x="46" y="512">◆ Open chat on X, presses Send</text>
  <text class="m" x="46" y="530">strangers are sent by hand</text>
  <text class="dim" x="46" y="570">──────────────────</text>
  <text class="m" x="46" y="592">models never send</text>
  <text class="m" x="46" y="608">models never block alone</text>
  <text class="m" x="46" y="624">models never edit approved</text>
  <text class="m" x="46" y="640">text</text>
  <text class="m" x="46" y="684">asked: 1 approval / message</text>
  <path class="ln" d="M256 150H278"/>

  <!-- Top center: LLM -->
  <rect class="box-p" x="278" y="112" width="440" height="96" rx="10"/>
  <text class="h p" x="498" y="136" text-anchor="middle">LLM · writes JSON</text>
  <text class="w" x="498" y="156" text-anchor="middle">Fit → Draft → Translate → Reply</text>
  <text class="m" x="498" y="176" text-anchor="middle">schema-checked · asked twice · job retried 3 times</text>
  <text class="m" x="498" y="194" text-anchor="middle">Verify by the LLM only in the sandbox (yes / no)</text>

  <!-- Top right: code -->
  <rect class="box-g" x="738" y="112" width="242" height="96" rx="10"/>
  <text class="h g" x="859" y="136" text-anchor="middle">CODE · no model</text>
  <text class="m" x="752" y="156">stop words → Opt-out</text>
  <text class="m" x="752" y="172">one send right per person</text>
  <text class="m" x="752" y="188">30-day invitation · text hash</text>
  <text class="m" x="752" y="203" opacity="0">.</text>
  <path class="ln" d="M498 208V236"/>

  <!-- Decision model -->
  <rect class="box-b" x="278" y="238" width="702" height="292" rx="10"/>
  <text class="h b" x="296" y="264">DECISION MODEL · yes/no layer</text>
  <text class="m" x="960" y="264" text-anchor="end">Verify + 6 draft checks</text>
  <text class="m" x="296" y="282">Verify: is a Fit reason backed by the post it cites? yes · Unsure · no</text>

  <text class="w" x="296" y="316">sensitive guesses</text><rect class="track" x="486" y="304" width="360" height="16" rx="3"/><rect x="487" y="305" width="348" height="14" rx="2" fill="#38bdf8"/><rect x="835" y="305" width="11" height="14" fill="url(#hatch)"/><text class="w" x="860" y="317">115/115  ≥0.97</text>
  <text class="w" x="296" y="346">made-up familiarity</text><rect class="track" x="486" y="334" width="360" height="16" rx="3"/><rect x="487" y="335" width="339" height="14" rx="2" fill="#38bdf8"/><rect x="826" y="335" width="20" height="14" fill="url(#hatch)"/><text class="w" x="860" y="347">119/121  ≥0.94</text>
  <text class="w" x="296" y="376">written for this person</text><rect class="track" x="486" y="364" width="360" height="16" rx="3"/><rect x="487" y="365" width="349" height="14" rx="2" fill="#38bdf8"/><rect x="836" y="365" width="10" height="14" fill="url(#hatch)"/><text class="w" x="860" y="377">123/123  ≥0.97</text>
  <text class="w" x="296" y="406">loaded questions</text><rect class="track" x="486" y="394" width="360" height="16" rx="3"/><rect x="487" y="395" width="346" height="14" rx="2" fill="#38bdf8"/><rect x="833" y="395" width="13" height="14" fill="url(#hatch)"/><text class="w" x="860" y="407">137/138  ≥0.96</text>
  <text class="w" x="296" y="436">backed by the evidence</text><rect class="track" x="486" y="424" width="360" height="16" rx="3"/><text class="m" x="860" y="437">no figure shown</text>
  <text class="w" x="296" y="466">their own account</text><rect class="track" x="486" y="454" width="360" height="16" rx="3"/><text class="m" x="860" y="467">no figure shown</text>
  <text class="m" x="296" y="494">bar = 95% lower bound of accuracy, labelled sets (AI-written, not real drafts)</text>
  <text class="w" x="296" y="516"><tspan class="b">≥70% yes</tspan>  ·  <tspan class="o">≤30% no → a person ticks</tspan>  ·  between → warning</text>
  <path class="ln" d="M628 530V556"/>

  <rect x="278" y="558" width="702" height="26" rx="6" fill="#08121f" stroke="#1e3a5f"/>
  <text class="w" x="628" y="576" text-anchor="middle">worker · 3 model lanes side by side + 1 main lane · jobs table, SKIP LOCKED</text>
  <path class="ln" d="M380 584V604"/><path class="ln" d="M628 584V604"/><path class="ln" d="M880 584V604"/>

  <!-- Lanes -->
  <rect x="278" y="606" width="222" height="96" rx="8" fill="#120d24" stroke="#a78bfa"/>
  <text class="h p" x="292" y="630">score</text>
  <text class="m" x="292" y="650">Fit + Verify · gpt-6-luna</text>
  <text class="w" x="292" y="670">10 people · 15.9 s</text>
  <text class="m" x="292" y="688">32 calls · $0.0036 · live run</text>
  <rect x="517" y="606" width="222" height="96" rx="8" fill="#120d24" stroke="#a78bfa"/>
  <text class="h p" x="531" y="630">draft</text>
  <text class="m" x="531" y="650">Draft, then the 6 checks</text>
  <text class="w" x="531" y="670">7 people · 8.9 s</text>
  <text class="m" x="531" y="688">was 23.6 s before speed-up</text>
  <rect x="756" y="606" width="224" height="96" rx="8" fill="#0a1a10" stroke="#4ade80"/>
  <text class="h g" x="770" y="630">reply</text>
  <text class="m" x="770" y="650">stop rule first, then class</text>
  <text class="w" x="770" y="670">184 / 187 right</text>
  <text class="m" x="770" y="688">AI-written replies, not real</text>

  <!-- back to person -->
  <rect class="box-o2" x="278" y="722" width="702" height="46" rx="8"/>
  <text class="h o" x="296" y="742">Back to a person</text>
  <text class="w" x="296" y="760">Review: approve the exact text · Send refuses if the hash changed · nothing is resent on a timeout</text>

  <!-- Caveat -->
  <rect x="20" y="784" width="960" height="72" rx="8" fill="#1a1405" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text class="h o" x="34" y="806">READ THE NUMBERS AS RELATIVE, NOT AS A GUARANTEE</text>
  <text class="m" x="34" y="824">· The sets are AI-written and labelled by their writers: agreement with those labels, not accuracy on real drafts or replies.</text>
  <text class="m" x="34" y="840">· 26 to 138 examples per question, one model, one prompt version, one run. Fit labels and claim checks were not measured.</text>
  <text class="m" x="34" y="852" opacity="0">.</text>
  <g transform="translate(0,76)">
  <!-- Session log -->
  <text class="m" x="20" y="800">session log · live run, X real, gpt-6-luna, UTC</text>
  <text class="dim" x="20" y="808">────────────────────────────────────────────────────────────────────────────────────────────────────</text>
  <text class="m" x="20" y="826">15:04:37.963</text><text class="pl" x="130" y="826">fit</text><text class="w" x="190" y="826">gpt-6-luna  in 398  out 343 tokens</text><text class="gl" x="980" y="826" text-anchor="end">scored</text>
  <text class="m" x="20" y="846">15:04:39.004</text><text class="pl" x="130" y="846">verify</text><text class="w" x="190" y="846">gpt-6-luna  in 136  out  43 tokens</text><text class="gl" x="980" y="846" text-anchor="end">Verified/Inferred</text>
  <text class="m" x="20" y="866">15:04:51.620</text><text class="pl" x="130" y="866">fit</text><text class="w" x="190" y="866">gpt-6-luna  in 413  out 488 tokens</text><text class="gl" x="980" y="866" text-anchor="end">scored</text>
  <text class="m" x="20" y="886">15:04:53.890</text><text class="pl" x="130" y="886">verify</text><text class="w" x="190" y="886">gpt-6-luna  in 154  out 129 tokens</text><text class="gl" x="980" y="886" text-anchor="end">last call · 15.9 s in all</text>

  <text class="m" x="20" y="918">~/xdm-scout $  <tspan class="w">X_MODE=live LLM_MODEL= DECISION_MODEL=gpt-6-luna</tspan></text>
  <text class="dim" x="20" y="934" opacity="0">.</text>
  <text class="m" x="980" y="918" text-anchor="end">fit 10 · verify 22 · $0.0036</text>
  </g>
</svg>
