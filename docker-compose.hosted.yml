# Hosted live deploy for one owner: real X, the owner's own X app and OpenAI key (entered in the app, stored encrypted).
# The owner claims it once with INVITE_CODE, then signs in with a password. Only Caddy is public (80, 443); MySQL has no published port.
# Images come from GHCR (workflow image.yml), so the server never builds. Settings: hosted.env.example.
name: xdm-hosted

x-env: &env
  DATABASE_URL: mysql://xdm:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db:3306/xdm?allowPublicKeyRetrieval=true
  X_MODE: live
  PORT: "3001"
  ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
  X_REDIRECT_URI: https://${DOMAIN:?set DOMAIN in .env}/api/auth/x/callback
  ACCESS_GATE: "on"
  # The call post lane is not offered on the hosted deploy yet.
  CALL_POST: "off"
  INVITE_CODE: ${INVITE_CODE:?set INVITE_CODE in .env}
  TOKEN_KEY: ${TOKEN_KEY:?set TOKEN_KEY in .env}
  # Empty: the live default (gpt-6-luna), with the OpenAI key the owner saves on Settings > Keys.
  LLM_MODEL: ""
  # Yes/no checks go to the OpenAI Decisions API, which returns a probability per answer.
  DECISION_MODEL: gpt-6-luna

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF", "--max-connections=30"]
    environment:
      MYSQL_DATABASE: xdm
      MYSQL_USER: xdm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  app:
    image: ghcr.io/ltv56/xdm-scout-app:${APP_TAG:-dev}
    restart: unless-stopped
    environment: *env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    image: ghcr.io/ltv56/xdm-scout-app:${APP_TAG:-dev}
    restart: unless-stopped
    command: ["node", "dist/worker-main.js"]
    environment: *env
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  db:
  caddy-data:
